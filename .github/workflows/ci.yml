name: Spring Boot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: chmod +x mvnw && ./mvnw clean package -DskipTests

      - name: Build Docker image
        run: docker build -t gameflix-backend:latest .

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: gameflix-backend:latest
          format: cyclonedx-json
          output-file: gameflix-sbom.cdx.json
          upload-artifact: false

      - name: Scan image for CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gameflix-backend:latest
          format: json
          output: trivy-results.json
          severity: CRITICAL
          scanners: vuln
          exit-code: '1'

      - name: Upload SBOM and vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameflix-security-reports
          path: |
            gameflix-sbom.cdx.json
            trivy-results.json
          if-no-files-found: warn
          retention-days: 30